[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-sc-screening"
version = "1.0.0"
description = "Topological superconductivity screening by space-group symmetry (Theorem 9.1.12.01)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Guobin Ouyang" }]
keywords = ["superconductivity", "topology", "space-group", "screening", "crystallography"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/sdoygb/topo-sc-screening"

[tool.setuptools]
py-modules = ["screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]

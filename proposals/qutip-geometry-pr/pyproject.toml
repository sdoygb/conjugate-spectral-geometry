[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qutip-geometry"
version = "0.0.1"
description = "Parameter-space Berry curvature and Chern number tools for QuTiP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "qutip>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

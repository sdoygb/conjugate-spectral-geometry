[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-distance-certificates"
version = "0.1.0"
description = "Certificate-based distance verification for CSS Reed-Muller codes (no enumeration)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Guobin Ouyang" }]
keywords = ["quantum-error-correction", "reed-muller", "css-codes", "code-distance", "certificate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sdoygb/qec-distance-certificates"
Repository = "https://github.com/sdoygb/qec-distance-certificates"
BugTracker = "https://github.com/sdoygb/qec-distance-certificates/issues"

[project.scripts]
qec-cert = "qec_cert.cli:main"

[tool.setuptools.packages.find]
include = ["qec_cert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
